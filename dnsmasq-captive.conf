# EMS-HANGER Captive Portal DNS Configuration
# Place this file in: /etc/dnsmasq.d/captive-portal.conf
# Then run: sudo systemctl restart dnsmasq

# Only listen on the hotspot interface
interface=wlan0
bind-interfaces

# Don't use upstream DNS - resolve everything locally
no-resolv

# Redirect ALL domain queries to the Raspberry Pi
# This is what makes captive portal auto-redirect work!
address=/#/10.42.0.1

# DHCP settings (if NetworkManager isn't handling DHCP)
# dhcp-range=10.42.0.10,10.42.0.250,12h
# dhcp-option=3,10.42.0.1  # Gateway
# dhcp-option=6,10.42.0.1  # DNS Server

# Log queries for debugging (optional)
# log-queries
# log-facility=/var/log/dnsmasq.log
